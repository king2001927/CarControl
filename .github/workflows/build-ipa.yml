# 一键构建 IPA
#
# 触发方式：
#   1. 仓库 Actions 页 → Build IPA → Run workflow（手动）
#   2. 推送 v 开头的 tag（如 v0.1.0）自动构建
#
# 签名（二选一，自动判断）：
#   - 已配置 Secrets → 用证书 + 描述文件签名，产出可直接安装的 IPA
#   - 未配置 Secrets → 产出未签名 IPA（仅 TrollStore/越狱设备可装）
#
# 需要的 Secrets（付费开发者账号才支持，见 README）：
#   TEAM_ID              团队 ID（10 位，开发者账号页面可见）
#   CERT_P12_BASE64      签名证书 .p12 的 base64
#   CERT_PASSWORD        .p12 的导出密码
#   PROFILE_APP_BASE64   主 App 的 .mobileprovision base64
#   PROFILE_WIDGET_BASE64 小组件的 .mobileprovision base64

name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    env:
      APP_BUNDLE_ID: com.example.carcontrol
      WIDGET_BUNDLE_ID: com.example.carcontrol.widget
      PROFILE_NAME: "CarControl CI"
      CODE_SIGN_IDENTITY: "Apple Distribution"
      # 下面这个表达式判断用户是否配置了签名 Secrets
      HAS_SIGNING: ${{ secrets.CERT_P12_BASE64 != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CarControl.xcodeproj -scheme CarControl

      # ============ 签名路径 ============

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          mkdir -p build
          echo "$CERT_P12_BASE64" | base64 -d > build/cert.p12
          KEYCHAIN_PW="ci-${{ github.run_id }}"
          security create-keychain -p "$KEYCHAIN_PW" build.keychain || true
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import build/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain
          security list-keychains -d user -s build.keychain login.keychain

      - name: Install provisioning profiles
        if: env.HAS_SIGNING == 'true'
        env:
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_WIDGET_BASE64: ${{ secrets.PROFILE_WIDGET_BASE64 }}
        run: |
          mkdir -p build
          echo "$PROFILE_APP_BASE64" | base64 -d > build/app.mobileprovision
          echo "$PROFILE_WIDGET_BASE64" | base64 -d > build/widget.mobileprovision
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          for f in app widget; do
            UUID=$(security cms -D -i "build/$f.mobileprovision" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
            cp "build/$f.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
            echo "installed profile $f -> $UUID"
          done

      - name: Archive and export signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild -project CarControl.xcodeproj -scheme CarControl \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/CarControl.xcarchive archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY"

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>compileBitcode</key><false/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$CODE_SIGN_IDENTITY</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key><string>$PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/CarControl.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist

      # ============ 未签名路径 ============

      - name: Archive unsigned
        if: env.HAS_SIGNING == 'false'
        run: |
          xcodebuild -project CarControl.xcodeproj -scheme CarControl \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/CarControl.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        if: env.HAS_SIGNING == 'false'
        run: |
          mkdir -p build/unsigned/Payload
          cp -R "build/CarControl.xcarchive/Products/Applications/CarControl.app" build/unsigned/Payload/
          cd build/unsigned && zip -qry CarControl-unsigned.ipa Payload
          echo "::warning::当前构建为未签名 IPA，普通 iPhone 无法安装；仅支持 TrollStore / 越狱设备。要在普通设备安装，请配置签名 Secrets（付费开发者账号）。"

      # ============ 上传产物 ============

      - name: Upload IPA (signed)
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CarControl-IPA
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload IPA (unsigned)
        if: env.HAS_SIGNING == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: CarControl-IPA-unsigned
          path: build/unsigned/*.ipa
          if-no-files-found: error
